name: Supabase Ping & Keep Alive

on:
  schedule:
    - cron: '0 7 * * 1,4'  # Her Pazartesi Perşembe 07:00 UTC (Türkiye 10:00)
  workflow_dispatch:      # Manuel tetikleme

permissions:
  contents: write         # Commit atabilmek için

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase'e ping gönder
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/ayarlar?select=anahtar&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP yanıt kodu: $response"
          if [ "$response" = "200" ]; then
            echo "✓ Supabase aktif."
          else
            echo "⚠ Beklenmeyen yanıt: $response"
            exit 1
          fi

      - name: GitHub reposunu aktif tut (60 gün kuralı)
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit --allow-empty -m "chore: keep alive $(date '+%Y-%m-%d')"
          git push
